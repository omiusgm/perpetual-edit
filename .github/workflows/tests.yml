name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
